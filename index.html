<head>
    <meta charset="UTF-8">

    <style>
        * {

            box-sizing: border-box;
            font-family: Arial, sans-serif;

<body>

    <div class="container">

        <h1>📝 Advanced To-Do List</h1>

        <!-- Add Task -->
        <div class="input-box">
            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <button class="add-btn" onclick="addTask()">
                Add Task
            </button>
        </div>

        <!-- Search -->
        <input
            type="text"
            id="searchInput"
            placeholder="🔍 Search tasks..."
            oninput="renderTasks()"
        >

        <!-- Filters -->
        <div class="filters">

            <button
                class="filter-btn active"
                onclick="setFilter('all', this)"
            >
                All
            </button>

            <button
                class="filter-btn"
                onclick="setFilter('active', this)"
            >
                Active
            </button>

            <button
                class="filter-btn"
                onclick="setFilter('completed', this)"
            >
                Completed
            </button>

        </div>

        <!-- Task List -->
        <ul id="taskList"></ul>

        <!-- Bottom Section -->
        <div class="bottom">

            <span id="taskCount">
                0 tasks
            </span>

            <button
                class="clear-btn"
                onclick="clearCompleted()"
            >
                Clear Completed
            </button>

        </div>

    </div>

    <script>

        // LocalStorage se tasks load karo
        let tasks = JSON.parse(
            localStorage.getItem("tasks")
        ) || [];

        let currentFilter = "all";

        const taskInput =
            document.getElementById("taskInput");

        const taskList =
            document.getElementById("taskList");

        const searchInput =
            document.getElementById("searchInput");

        const taskCount =
            document.getElementById("taskCount");


        // Add Task
        function addTask() {

            const text = taskInput.value.trim();

            if (text === "") {
                alert("Please enter a task!");
                return;
            }

            const task = {
                id: Date.now(),
                text: text,
                completed: false
            };

            tasks.push(task);

            saveTasks();

            taskInput.value = "";

            renderTasks();
        }


        // Enter press karke task add
        taskInput.addEventListener("keydown", function(event) {

            if (event.key === "Enter") {
                addTask();
            }

        });


        // Save tasks
        function saveTasks() {

            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );

        }


        // Display Tasks
        function renderTasks() {

            taskList.innerHTML = "";

            const searchText =
                searchInput.value.toLowerCase();

            const filteredTasks = tasks.filter(task => {

                const searchMatch =
                    task.text
                    .toLowerCase()
                    .includes(searchText);

                let filterMatch = true;

                if (currentFilter === "active") {
                    filterMatch = !task.completed;
                }

                if (currentFilter === "completed") {
                    filterMatch = task.completed;
                }

                return searchMatch && filterMatch;

            });


            if (filteredTasks.length === 0) {

                taskList.innerHTML =
                    `<div class="empty">
                        No tasks found 🎉
                    </div>`;

            }


            filteredTasks.forEach(task => {

                const li = document.createElement("li");

                li.className = "task";

                if (task.completed) {
                    li.classList.add("completed");
                }

                li.innerHTML = `

                    <button
                        class="check-btn"
                        onclick="toggleTask(${task.id})"
                    >
                        ${task.completed ? "✓" : ""}
                    </button>

                    <span class="task-text">
                        ${escapeHTML(task.text)}
                    </span>

                    <button
                        class="edit-btn"
                        onclick="editTask(${task.id})"
                    >
                        ✏️
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteTask(${task.id})"
                    >
                        🗑️
                    </button>

                `;

                taskList.appendChild(li);

            });


            updateTaskCount();
        }


        // Complete / Uncomplete Task
        function toggleTask(id) {

            tasks = tasks.map(task => {

                if (task.id === id) {
                    task.completed = !task.completed;
                }

                return task;

            });

            saveTasks();

            renderTasks();
        }


        // Edit Task
        function editTask(id) {

            const task =
                tasks.find(task => task.id === id);

            if (!task) return;

            const newText =
                prompt("Edit your task:", task.text);

            if (newText === null) return;

            const updatedText =
                newText.trim();

            if (updatedText === "") {
                alert("Task cannot be empty!");
                return;
            }

            task.text = updatedText;

            saveTasks();

            renderTasks();
        }


        // Delete Task
        function deleteTask(id) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this task?"
                );

            if (!confirmDelete) return;

            tasks = tasks.filter(
                task => task.id !== id
            );

            saveTasks();

            renderTasks();
        }


        // Filter Tasks
        function setFilter(filter, button) {

            currentFilter = filter;

            document
                .querySelectorAll(".filter-btn")
                .forEach(btn => {
                    btn.classList.remove("active");
                });

            button.classList.add("active");

            renderTasks();
        }


        // Clear Completed Tasks
        function clearCompleted() {

            const completedTasks =
                tasks.filter(task => task.completed);

            if (completedTasks.length === 0) {
                alert("No completed tasks!");
                return;
            }

            const confirmClear =
                confirm(
                    "Delete all completed tasks?"
                );

            if (!confirmClear) return;

            tasks =
                tasks.filter(task => !task.completed);

            saveTasks();

            renderTasks();
        }


        // Task Counter
        function updateTaskCount() {

            const activeTasks =
                tasks.filter(
                    task => !task.completed
                ).length;

            if (activeTasks === 0) {

                taskCount.textContent =
                    "0 tasks remaining";

            } else if (activeTasks === 1) {

                taskCount.textContent =
                    "1 task remaining";

            } else {

                taskCount.textContent =
                    `${activeTasks} tasks remaining`;

            }
        }


        // HTML Escape
        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent = text;

            return div.innerHTML;
        }


        // Page load hone par tasks show karo
        renderTasks();

    </script>

</body>
</html>
